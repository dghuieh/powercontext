<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StepFun × seekdb 迷你知识库（端侧向量化）</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header>
  <h1>端侧迷你知识库 <span class="tag">StepFun × seekdb</span></h1>
  <div class="badges">
    <span id="badge-backend" class="badge badge-wait">推理后端：检测中…</span>
    <span id="badge-model" class="badge badge-wait">模型：未加载</span>
    <span id="badge-db" class="badge badge-wait">seekdb：检测中…</span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>1. 导入语料（本地向量化后写入 seekdb）</h2>
    <div class="row">
      <input id="collection" value="kb_default" title="集合名（可切换以隔离不同知识库）" />
      <input id="files" type="file" accept=".txt,.md,.json" multiple />
      <button id="btn-sample">填入示例语料</button>
      <button id="btn-ingest" class="primary">导入并向量化</button>
    </div>
    <textarea id="corpus" rows="7" placeholder="每行一段文本；也可选择 .txt/.md 文件导入。文本会在你的浏览器内完成向量化，原始文本与向量写入 seekdb。"></textarea>
    <div class="progress"><div id="bar-ingest"></div></div>
    <div id="log-ingest" class="log"></div>
  </section>

  <section class="panel">
    <h2>2. 查询（seekdb 内完成向量 + 全文混合检索）</h2>
    <div class="row">
      <input id="query" placeholder="输入问题，例如：向量索引怎么加速检索？" />
      <label class="slider">向量权重 <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.7" /><span id="alpha-val">0.70</span></label>
      <button id="btn-search" class="primary">检索</button>
    </div>
    <div class="progress"><div id="bar-query"></div></div>
    <div id="log-query" class="log"></div>
    <ol id="results" class="results"></ol>
  </section>

  <section class="panel">
    <h2>3. 分阶段耗时（本机实测）</h2>
    <table id="timing">
      <thead><tr><th>阶段</th><th>耗时</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
