app:
  description: 你把今天的小事说给它，它会记住；下次它翻出旧账来损你。一个把 PowerContext 长期记忆当"把柄库"的赛博损友。
  icon: 🗂️
  icon_background: '#FFF4ED'
  mode: advanced-chat
  name: 损友记忆交易所
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
    - description: PowerContext HTTP API 地址
      id: pc_base_url
      name: PC_BASE_URL
      selector: [env, PC_BASE_URL]
      value: http://host.docker.internal:8848
      value_type: string
    - description: PowerContext API Key（与 .env 中 API_KEY 一致）
      id: pc_api_key
      name: PC_API_KEY
      selector: [env, PC_API_KEY]
      value: changeme
      value_type: string
    - description: 记忆归属用户，用于跨会话复用同一份"把柄库"
      id: pc_user_id
      name: PC_USER_ID
      selector: [env, PC_USER_ID]
      value: dify-player-1
      value_type: string
  features:
    opening_statement: 我是你的赛博损友，负责记住你说过的每句大话。今天有什么想记一笔的？
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 我今天说我要开始早睡了
      - 我今天又点了一杯奶茶
      - 我今天说要每天跑步
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    file_upload:
      enabled: false
  graph:
    edges:
      - id: e-start-search
        source: start
        sourceHandle: source
        target: search_memory
        targetHandle: target
        type: custom
        data:
          isInIteration: false
          sourceType: start
          targetType: http-request
      - id: e-search-roast
        source: search_memory
        sourceHandle: source
        target: roast_llm
        targetHandle: target
        type: custom
        data:
          isInIteration: false
          sourceType: http-request
          targetType: llm
      - id: e-roast-save
        source: roast_llm
        sourceHandle: source
        target: save_memory
        targetHandle: target
        type: custom
        data:
          isInIteration: false
          sourceType: llm
          targetType: http-request
      - id: e-save-answer
        source: save_memory
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        data:
          isInIteration: false
          sourceType: http-request
          targetType: answer
    nodes:
      - id: start
        type: custom
        width: 244
        height: 116
        position: {x: 40, y: 280}
        positionAbsolute: {x: 40, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 用户今天想记一笔的事
          selected: false
          title: 开始
          type: start
          variables:
            - label: 今天的小事
              max_length: 512
              options: []
              required: true
              type: paragraph
              variable: query
      - id: search_memory
        type: custom
        width: 244
        height: 90
        position: {x: 340, y: 280}
        positionAbsolute: {x: 340, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 从 PowerContext 检索相关旧记忆（seekdb 向量召回）
          selected: false
          title: 翻旧账
          type: http-request
          method: post
          url: '{{#env.PC_BASE_URL#}}/api/v1/memories/search'
          authorization:
            type: no-auth
            config: null
          headers: 'X-API-Key: {{#env.PC_API_KEY#}}'
          params: ''
          body:
            type: json
            data:
              - type: text
                key: query
                value: '{{#start.query#}}'
              - type: text
                key: user_id
                value: '{{#env.PC_USER_ID#}}'
              - type: number
                key: limit
                value: 5
          timeout:
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
            max_connect_timeout_enabled: false
            max_read_timeout_enabled: false
            max_write_timeout_enabled: false
          variables:
            - variable: body
              value_selector: []
          retry_config:
            retry_enabled: true
            max_retries: 2
            retry_interval: 1000
          error_strategy: default-value
          default_value:
            - key: body
              type: string
              value: '{"success":false,"data":{"results":[]}}'
      - id: roast_llm
        type: custom
        width: 244
        height: 98
        position: {x: 640, y: 280}
        positionAbsolute: {x: 640, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 结合旧记忆生成吐槽式回应
          selected: false
          title: 损友损你
          type: llm
          model:
            provider: langgenius/ollama/ollama
            name: qwen2.5:7b
            mode: chat
            completion_params:
              temperature: 0.8
              top_p: 0.9
              max_tokens: 512
          prompt_template:
            - role: system
              text: |
                你是一个嘴很损但心很软的赛博损友。你会翻出用户以前说过的话来调侃他，但最后一定给一句真心建议。
                规则：
                1. 只能引用【旧记忆】里真实出现过的内容，绝不编造用户没说过的事；
                2. 若【旧记忆】为空或与本次无关，就只针对今天这句话吐槽，不要假装记得；
                3. 回复控制在 120 字以内，口语化，可以有 1 个 emoji；
                4. 结尾用一句话把这个"把柄"归档，例如"已记账，等你打脸"。
            - role: user
              text: |
                用户今天说：{{#start.query#}}

                【旧记忆】（来自 PowerContext 检索，JSON 原文，score 越高越相关）：
                {{#search_memory.body#}}

                请先判断旧记忆里是否有能和今天这句形成反差的内容，再决定吐槽方式。
          vision:
            enabled: false
          context:
            enabled: true
            variable_selector: [search_memory, body]
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: false
              size: 5
      - id: save_memory
        type: custom
        width: 244
        height: 90
        position: {x: 940, y: 280}
        positionAbsolute: {x: 940, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 把今天这句写回 PowerContext 长期记忆
          selected: false
          title: 记一笔
          type: http-request
          method: post
          url: '{{#env.PC_BASE_URL#}}/api/v1/memories'
          authorization:
            type: no-auth
            config: null
          headers: 'X-API-Key: {{#env.PC_API_KEY#}}'
          params: ''
          body:
            type: json
            data:
              - type: text
                key: content
                value: '{{#start.query#}}'
              - type: text
                key: user_id
                value: '{{#env.PC_USER_ID#}}'
              - type: text
                key: scope
                value: user
              - type: text
                key: memory_type
                value: fact
              - type: boolean
                key: infer
                value: true
          timeout:
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
            max_connect_timeout_enabled: false
            max_read_timeout_enabled: false
            max_write_timeout_enabled: false
          variables:
            - variable: body
              value_selector: []
          retry_config:
            retry_enabled: true
            max_retries: 2
            retry_interval: 1000
          error_strategy: continue-on-error
      - id: answer
        type: custom
        width: 244
        height: 116
        position: {x: 1240, y: 280}
        positionAbsolute: {x: 1240, y: 280}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 输出损友回复
          selected: false
          title: 直接回答
          type: answer
          answer: '{{#roast_llm.text#}}'
          variables: []
